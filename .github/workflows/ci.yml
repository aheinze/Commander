name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  headless:
    name: Headless workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt
      - name: Install native UI dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev xvfb xauth dbus-daemon mutter gvfs gvfs-backends gvfs-fuse fuse3 python3-venv
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Run isolated native interaction regressions
        run: python3 scripts/test-native.py --backend wayland --output target/native-ci
      - name: Check real FTP login, copying, and connection loss
        run: |
          python3 -m venv "$RUNNER_TEMP/ftp-tests"
          "$RUNNER_TEMP/ftp-tests/bin/pip" install pyftpdlib==2.1.0
          "$RUNNER_TEMP/ftp-tests/bin/python" -B scripts/test-ftp.py --output target/ftp-ci
      - name: Upload native regression logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-regressions
          path: |
            target/native-ci
            target/ftp-ci
          if-no-files-found: ignore
      - name: Test release packaging helpers
        run: python3 -B -m unittest discover -s packaging -p 'test_*.py'
      - name: Build GTK-free headless crates
        run: cargo check -p dualpane-core -p dualpane-vfs -p dualpane-engine -p dualpane-index
      - name: Generate the flat 100k-entry fixture
        run: cargo xtask gen-fixtures --root target/ci-fixtures/flat-100k --files 100000 --files-per-directory 100000
      - name: Compile Criterion performance suites
        run: cargo bench --package dualpane-benches --no-run --locked
      - name: Enforce M1 release performance budgets
        run: cargo xtask check-m1-budgets --root target/ci-fixtures/flat-100k/bucket-000000
      - name: Build release application
        run: cargo build --release --package dualpane-app --locked
      - name: Smoke-test native shell under Xvfb
        run: timeout 30s xvfb-run -a target/release/commander --benchmark target/ci-fixtures/flat-100k/bucket-000000 --quit-after-first-paint

  msrv:
    name: MSRV 1.96
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Check GTK-free crates on the declared MSRV
        run: cargo check -p dualpane-core -p dualpane-vfs -p dualpane-engine -p dualpane-index
