[workspace]
members = [
    "benches",
    "crates/app",
    "crates/core",
    "crates/engine",
    "crates/index",
    "crates/platform",
    "crates/thumbs",
    "crates/vfs",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
directories = "6.0.0"
crossbeam-channel = "0.5.16"
criterion = "0.8.2"
flate2 = "1.1.2"
dualpane-core = { path = "crates/core" }
dualpane-engine = { path = "crates/engine" }
dualpane-index = { path = "crates/index" }
dualpane-platform = { path = "crates/platform" }
dualpane-thumbs = { path = "crates/thumbs" }
dualpane-vfs = { path = "crates/vfs" }
insta = "1.48.0"
image = { version = "0.25.8", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tga", "tiff", "webp"] }
karet-pdf = "0.6.0"
libc = "0.2.189"
lopdf = { version = "0.38.0", default-features = false }
notify = "8.2.0"
nucleo = "0.5.0"
proptest = "1.11.0"
portable-pty = "0.9.0"
vt100 = "0.16.2"
rayon = "1.12.0"
regex = "1.12.2"
relm4 = { version = "0.11.0", default-features = false, features = ["gnome_46", "libadwaita", "macros"] }
relm4-components = { version = "0.11.0", features = ["libadwaita"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
sevenz-rust2 = { version = "0.20.2", features = ["deflate", "lz4", "zstd", "brotli"] }
sha2 = "0.10.9"
shlex = "1.3.0"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
tar = "0.4.44"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time"] }
toml_edit = { version = "0.25.13", features = ["serde"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-tracy = "0.12.0"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
debug = true

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unused_lifetimes = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
